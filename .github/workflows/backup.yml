name: Back up live sites

# Reads each site's current files through the Hostinger API (read only, needs the
# HOSTINGERAPITOKEN secret) and keeps them as a workflow artifact for 30 days.
# Run it before anything is published to a site.
on:
  workflow_dispatch:

jobs:
  inventory:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.m.outputs.matrix }}
    env:
      HOSTINGER_API_TOKEN: ${{ secrets.HOSTINGERAPITOKEN }}
    steps:
      - uses: actions/checkout@v5
      - id: m
        run: |
          pip install --quiet pyyaml
          echo "matrix=$(python3 -c 'import json,yaml; s=yaml.safe_load(open("sites.yaml")); print(json.dumps([{"slug":k,"domain":v.get("hosting_domain",v["domain"])} for k,v in s.items()]))')" >> "$GITHUB_OUTPUT"
      - name: List websites on the Hostinger account
        run: |
          if [ -z "$HOSTINGER_API_TOKEN" ]; then
            echo "::error::Add the HOSTINGERAPITOKEN secret (hPanel > profile > API) first."
            exit 1
          fi
          python3 scripts/hostinger.py inventory

  backup:
    needs: inventory
    # site files can include config with passwords; never publish them from a public repo
    if: ${{ github.event.repository.private }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        site: ${{ fromJSON(needs.inventory.outputs.matrix) }}
    name: backup ${{ matrix.site.slug }}
    env:
      HOSTINGER_API_TOKEN: ${{ secrets.HOSTINGERAPITOKEN }}
    steps:
      - uses: actions/checkout@v5
      - run: python3 scripts/hostinger.py backup ${{ matrix.site.domain }} backup/${{ matrix.site.slug }}
      - uses: actions/upload-artifact@v5
        with:
          name: backup-${{ matrix.site.slug }}
          path: backup/
          include-hidden-files: true
          retention-days: 30

  public-repo:
    needs: inventory
    if: ${{ !github.event.repository.private }}
    runs-on: ubuntu-latest
    steps:
      - run: |
          echo "::error::The repo is public. Make it private (Settings > General > Change visibility) before backing up site files, since they can contain passwords."
          exit 1
