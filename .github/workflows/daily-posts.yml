name: Daily posts

on:
  schedule:
    - cron: "15 11 * * *"  # every day, 7:15am US Eastern (EDT)
  workflow_dispatch:
    inputs:
      sites:
        description: "Sites to post to (space separated), or 'all'"
        default: all
      count:
        description: "Posts per site (use more to fill a new site)"
        default: "1"

permissions:
  contents: write

concurrency:
  group: daily-posts
  cancel-in-progress: false

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Write posts with Claude
        id: gen
        continue-on-error: true
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          CLAUDE_MODEL: ${{ vars.CLAUDE_MODEL }}
        run: |
          SITES="${{ inputs.sites || 'all' }}"
          if [ "$SITES" = "all" ]; then SITES="--all"; fi
          python scripts/generate_post.py $SITES --count "${{ inputs.count || '1' }}"
      - name: Commit new posts
        run: |
          git config user.name "blog-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add content
          if git diff --cached --quiet; then echo "No new posts."; exit 0; fi
          git commit -m "Daily posts for $(date -u +%F)"
          for i in 1 2 3; do git pull --rebase origin main && git push origin HEAD:main && break; sleep 5; done
      - name: Fail if any site's post failed
        if: steps.gen.outcome == 'failure'
        run: |
          echo "::error::At least one post failed to generate. See the 'Write posts with Claude' step."
          exit 1

  deploy:
    needs: generate
    if: ${{ !cancelled() }}
    uses: ./.github/workflows/deploy.yml
    secrets: inherit
