name: Copy subscribers to Brevo

# Read only on the sites: copies each site's subscriber list into its Brevo list.
on:
  workflow_dispatch:

jobs:
  import:
    if: ${{ github.event.repository.private }}
    runs-on: ubuntu-latest
    env:
      HOSTINGER_API_TOKEN: ${{ secrets.HOSTINGERAPITOKEN }}
      BREVO_API_KEY: ${{ secrets.BREVO_API_KEY }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: pip install --quiet -r requirements.txt
      - run: python scripts/import_subscribers.py
