name: Weekly roundup email

on:
  schedule:
    - cron: "0 13 * * 1"  # Mondays, 9am US Eastern (EDT)
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Build the emails without sending them"
        type: boolean
        default: true

jobs:
  roundup:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Send roundups
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          BREVO_API_KEY: ${{ secrets.BREVO_API_KEY }}
          SENDER_EMAIL: ${{ vars.SENDER_EMAIL }}
          CLAUDE_MODEL: ${{ vars.CLAUDE_MODEL }}
        run: python scripts/weekly_roundup.py --all ${{ inputs.dry_run && '--dry-run' || '' }}
      - uses: actions/upload-artifact@v5
        if: ${{ inputs.dry_run }}
        with:
          name: roundup-emails
          path: dist/emails/
