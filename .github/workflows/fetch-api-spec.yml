name: Fetch Hostinger API spec

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - run: |
          mkdir -p docs
          curl -sfL https://developers.hostinger.com/openapi/openapi.json -o docs/hostinger-openapi.json
          git config user.name "blog-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/hostinger-openapi.json
          git diff --cached --quiet || (git commit -m "Update Hostinger API spec" && git push origin HEAD:main)
