name: Probe site endpoints

# Read-only: sends GET requests (never POST) to the sites' PHP endpoints to see what they expect.
on:
  workflow_dispatch:

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - run: |
          for d in defensestocks.org gamingstocks.org capitalraising.org; do
            for p in save-post.php save_post.php post.php api/save-post.php publish.php subscribe.php subscribers.csv subscribers.json emails.csv emails.txt data/subscribers.csv blog.json posts.json articles.json daily-articles.json .git/HEAD; do
              code=$(curl -s -o body.txt -w '%{http_code} %{content_type} %{size_download}' --max-time 15 "https://$d/$p")
              case "$code" in 404*) continue;; esac
              echo "== $d/$p -> $code"
              case "$p" in *.json) head -c 200 body.txt;; *) head -c 400 body.txt;; esac
              echo
            done
          done
