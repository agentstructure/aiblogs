name: Share ecosystem posts

# Every 30 minutes through the US day: shares new agentstructure.ai ecosystem posts (the daily
# API-written ones) on the AgentStructure accounts. AI Blogs posts are not shared here.
on:
  schedule:
    - cron: "20,50 12-23 * * *"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Only show what would be shared"
        type: boolean
        default: false

concurrency:
  group: publish
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  share:
    runs-on: ubuntu-latest
    env:
      BUFFER_API_KEY: ${{ secrets.BUFFER_API_KEY }}
      BLUESKY_HANDLE: ${{ vars.BLUESKY_HANDLE || 'agentstructure.bsky.social' }}
      BLUESKY_APP_PASSWORD: ${{ secrets.BLUESKY_APP_PASSWORD }}
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT: ${{ vars.TELEGRAM_CHAT || '@AgentStructure' }}
      DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: pip install --quiet -r requirements.txt
      - name: Share new ecosystem posts
        run: python scripts/share_ecosystem.py ${{ inputs.dry_run && '--dry-run' || '' }}
      - name: Record what was shared
        if: always()
        run: |
          git add social/ 2>/dev/null || true
          if git diff --cached --quiet; then exit 0; fi
          git config user.name "aiblogs publisher"
          git config user.email "actions@users.noreply.github.com"
          git commit -m "Record ecosystem social posts"
          for i in 1 2 3; do git pull --rebase -q origin main && git push -q origin HEAD:main && break; sleep 5; done
